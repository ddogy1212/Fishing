plugins {
    id 'com.android.application'
}

// The signing key is NEVER checked into the public repository.
// GitHub Actions sets these environment variables from repository secrets.
def releaseKeystore = System.getenv('FISHING_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('FISHING_STORE_PASSWORD')
def releaseAlias = System.getenv('FISHING_KEY_ALIAS')
def releaseKeyPassword = System.getenv('FISHING_KEY_PASSWORD')
def canSignRelease = [releaseKeystore, releaseStorePassword, releaseAlias,
                       releaseKeyPassword].every { it != null && !it.isEmpty() }

// Optional independent app: ./gradlew assembleDebug -PfreshInstall=true
// This is for SIDE-BY-SIDE installation, not to bypass Play Protect.
def freshInstall = project.findProperty('freshInstall') == 'true'

android {
    namespace 'com.ddogy.fishing'
    compileSdk 35

    defaultConfig {
        applicationId freshInstall ? 'com.ddogy.fishing.fresh194' : 'com.ddogy.fishing'
        minSdk 30
        targetSdk 35
        versionCode freshInstall ? 1 : 15
        versionName '1.9.4'
        manifestPlaceholders = [
            appLabel: freshInstall ? 'Fishing 배낚시 1.9.4' : '@string/app_name',
            accessibilityLabel: freshInstall ? 'Fishing 배낚시 1.9.4 도우미' : '@string/service_name'
        ]
    }

    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
}
