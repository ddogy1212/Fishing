plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ddogy.fishing'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ddogy.fishing'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
}
